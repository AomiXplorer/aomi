[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aomi"
version = "1.1.0"
description = "Engineering and design gates for AI agents: one skill, one workflow, one command line."
readme = "README.md"
# Not an OSI license: a custom source-available one. See LICENSE.
license = "LicenseRef-Aomi-Personal-Use-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Aomi", email = "AomiXplorer@users.noreply.github.com" }]
keywords = ["ai-agents", "skills", "design-system", "accessibility", "engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AomiXplorer/aomi"
Documentation = "https://github.com/AomiXplorer/aomi/tree/main/docs"

[project.scripts]
aomi = "aomi.cli:main"

[tool.setuptools]
packages = ["aomi"]
include-package-data = true

[tool.setuptools.package-data]
aomi = ["skilldata/**/*"]
